# watchmydog configuration.
#
# Copy to deploy/watchmydog.local.yaml (git-ignored) and adjust. Relative
# paths are resolved from this file's directory.
#
# Precedence: defaults < this file < WATCHMYDOG_* environment < flags.

# Where the HTTP API and web client listen. Localhost only: phones reach it
# through `tailscale serve` (HTTPS on the tailnet), never directly.
listen: 127.0.0.1:8080

# Generated files (go2rtc config), later recordings and the database.
data_dir: ../data

# Built web client (make web). Served at "/".
web_dir: ../web/dist

auth:
  # One-line shared secret, mode 0600, git-ignored. Create with `make secret`.
  # WATCHMYDOG_SECRET in the environment overrides the file.
  secret_file: ../data/secret
  # How long a device stays logged in.
  session_ttl: 720h
  # disabled: true   # local development only; anyone who can reach the port can watch

go2rtc:
  bin: go2rtc                 # resolved via PATH, or an absolute path
  api: 127.0.0.1:1984         # go2rtc's own API; proxied under /media/
  rtsp: 127.0.0.1:8554        # internal tap for audio analysis/recording
  webrtc_port: 8555           # must be reachable by viewers (LAN/tailnet)
  ffmpeg_bin: /opt/homebrew/bin/ffmpeg
  capture_bin: wmd-capture    # built by `make install-capture`
  log_level: info

# Noise detection (ADR-0007, tuning guide in docs/OPERATIONS.md). Levels are
# in dBFS: 0 is the microphone's maximum, a quiet room is about -50. The app's
# meter shows the live value. Restart the service after changing these.
sound:
  enabled: true
  threshold_dbfs: -30   # at or above this, the sound is "loud"
  hysteresis_db: 6      # "quiet" again only below threshold minus this (-36)
  min_duration: 1s      # loud time needed before an event starts
  quiet_time: 5s        # quiet time that ends an event

# Recording (ADR-0009): a clip for every noise event. Needs sound.enabled.
# With recording on, the camera runs around the clock.
recording:
  enabled: true
  pre_roll: 15s         # the clip begins this long before the noise
  post_roll: 15s        # and ends this long after it; noises closer together share a clip
  max_clip: 5m          # longest single clip; a longer noise gets several
  max_disk_mb: 10000    # disk space for all clips; the oldest are deleted to stay below
  keep_for: 720h        # delete clips older than this; 0s = only the disk limit deletes

# Notifications to phones (ADR-0008, guide in docs/OPERATIONS.md). Each device
# switches them on in the app. Restart the service after changing these.
push:
  enabled: true
  cooldown: 5m          # at most one notification per camera in this time; 0 = every event
  # quiet_hours:        # no notifications between these times (this Mac's clock);
  #   start: "23:00"    # noise is still detected and listed in the app
  #   end: "07:00"
  # contact: you@example.com   # email or https URL passed to the phone vendor's push
  #                            # service (Google for Android) with every notification.
  #                            # Optional: the default is a placeholder address.

cameras:
  - id: dog
    name: Living room
    video:
      device: REDRAGON Live Camera       # from `wmd-capture list`
      width: 1280
      height: 720
      fps: 30
      bitrate_kbps: 2500
      low:                               # optional reduced-quality stream for slow networks
        width: 640
        height: 360
    audio:
      device: REDRAGON Live Camera Audio # from `ffmpeg -f avfoundation -list_devices true -i ""`
